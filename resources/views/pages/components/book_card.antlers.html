<div class="col-lg-4 col-md-6">
    <div class="card h-100 border-0 shadow-sm rounded-4 overflow-hidden bg-white transition-hover" style="transition: transform 0.25s ease, box-shadow 0.25s ease;">
        <div class="position-relative overflow-hidden" style="padding-top: 66.67%;">
            <img src="{{ cover_image }}" alt="{{ alt_text ?? title }}" class="position-absolute top-0 start-0 w-100 h-100" style="object-fit: cover;">
        </div>
        <div class="card-body p-4 d-flex flex-column">
            {{ if book_categories }}
            <div class="mb-2">
                {{ book_categories }}
                <a href="/libros?categoria={{ slug }}" class="badge rounded-pill bg-light text-primary border text-decoration-none fw-semibold px-2 py-1" style="font-size: 11px;">
                    <i class="fa-solid fa-tag me-1 text-danger"></i>{{ title }}
                </a>
                {{ /book_categories }}
            </div>
            {{ /if }}
            <h5 class="fw-bold mb-2" style="color: var(--primary-blue);">{{ title }}</h5>
            <p class="text-muted small flex-grow-1">Material digital completo para consulta y práctica profesional.</p>
            <div class="mt-3 pt-3 border-top d-flex justify-content-between align-items-center">
                <a href="/inscripcion?curso={{ inscription_plan | urlencode }}" class="btn btn-gold btn-sm px-3 fw-bold">
                    Solicitar <i class="fa-solid fa-download ms-1"></i>
                </a>
                <a href="{{ global:site_settings:whatsapp_float_url }}" target="_blank" class="text-success small fw-bold">
                    <i class="fa-brands fa-whatsapp fs-6"></i> WhatsApp
                </a>
            </div>
        </div>
    </div>
</div>
